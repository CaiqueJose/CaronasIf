{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Caronas IF</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="header-logo">
        <h1>Caronas IF</h1>
        <p>Soluções de transporte compartilhado do IF</p>
    </div>

    <div class="card">
        <h2>Entrar na sua conta</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Usuário ou E-mail</label>
                <input type="text" name="username" id="id_username" placeholder="Usuário ou e-mail" required>
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" placeholder="Sua senha" required>
                <a href="#" class="esqueci-senha">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="divider">ou</div>

        <a href="{% url 'cadastro' %}" class="btn-secondary">Criar conta</a>
    </div>

    <footer>
        &copy; 2026 Caronas IF. Todos os direitos reservados.
    </footer>

</body>
</html>
